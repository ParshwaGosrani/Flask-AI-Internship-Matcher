{% extends 'base.html' %}

{% block title %}Student Profile{% endblock %}

{% block content %}
<div class="page-header text-center mb-4">
    <h2>Manage Your Profile</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title text-center">Your Details</h3>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ profile.phone if profile else '' }}" pattern="[0-9]{10}" placeholder="e.g., 9876543210" required>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ profile.location if profile else '' }}" placeholder="e.g., Mumbai, India" pattern="[a-zA-Z\s,.]+" title="Location should only contain text characters." required>
                    </div>
                    <div class="mb-3">
                        <label for="skills" class="form-label">Skills (comma-separated)</label>
                        <input type="text" class="form-control" id="skills" name="skills" value="{{ profile.skills if profile else '' }}" placeholder="e.g., Python, Data Analysis, Web Development" required>
                    </div>
                    <div class="mb-3">
                        <label for="interests" class="form-label">Interests (comma-separated)</label>
                        <input type="text" class="form-control" id="interests" name="interests" value="{{ profile.interests if profile else '' }}" placeholder="e.g., Machine Learning, UI/UX Design">
                    </div>
                    <div class="mb-3">
                        <label for="aspirations" class="form-label">Aspirations</label>
                        <textarea class="form-control" id="aspirations" name="aspirations" rows="3" placeholder="Describe your career goals...">{{ profile.aspirations if profile else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="academic_background" class="form-label">Academic Background</label>
                        <textarea class="form-control" id="academic_background" name="academic_background" rows="3" placeholder="e.g., B.Tech in Computer Science, Mumbai University">{{ profile.academic_background if profile else '' }}</textarea>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save Profile & View My Matches</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<hr class="mt-5">
<div class="text-center mt-4 mb-5">
    <h5 class="text-danger">Danger Zone</h5>
    <p class="text-muted">Once you delete your account, there is no going back. Please be certain.</p>
    
    <form action="{{ url_for('delete_student_account') }}" method="POST" onsubmit="return confirm('Are you sure you want to delete your account? This cannot be undone.');">
        <button type="submit" class="btn btn-outline-danger">Delete My Account</button>
    </form>
</div>
{% endblock %}

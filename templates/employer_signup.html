{% extends 'base.html' %}

{% block title %}Employer Signup{% endblock %}

{% block content %}
<!-- Page header with gradient text from base.html -->
<div class="page-header text-center mb-4">
    <h2>Create Your Employer Account</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <!-- The card will automatically inherit the styles from base.html -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title text-center">Employer Registration</h3>
            </div>
            <!-- Added p-4 for better internal spacing -->
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label for="company_name" class="form-label">Company Name</label>
                        <!-- form-control is styled in base.html -->
                        <input type="text" class="form-control" id="company_name" name="company_name" placeholder="Your company's name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Company Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <!-- btn and btn-primary are styled in base.html -->
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                 <!-- Added classes to the link for better styling -->
                <small>Already registered? <a href="{{ url_for('employer_login') }}" class="fw-bold text-decoration-none">Log In</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

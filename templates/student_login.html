{% extends 'base.html' %}

{% block title %}Student Login{% endblock %}

{% block content %}
<!-- Page header with gradient text from base.html -->
<div class="page-header text-center mb-4">
    <h2>Student Login</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <!-- The card will automatically inherit the styles (shadow, border-radius) from base.html -->
        <div class="card">
            <!-- The card-header provides a clean top section -->
            <div class="card-header">
                <h3 class="card-title text-center">Welcome Back!</h3>
            </div>
            <!-- Added p-4 for better internal spacing -->
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <!-- form-control is styled in base.html -->
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@university.edu" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <!-- btn and btn-primary are styled in base.html -->
                        <button type="submit" class="btn btn-primary">Log In</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <!-- Added classes to the link for better styling -->
                <small>Don't have an account? <a href="{{ url_for('student_signup') }}" class="fw-bold text-decoration-none">Sign Up</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
